name: rotakesit reels

on:
  schedule:
    # SAAT BASI calisir - gunde 2 kez DEGIL.
    #
    # Sebep: GitHub zamanlanmis calismalari rastgele dusuruyor. Bu repoda
    # 4-5 Eylul 2026'da 2/2 kacirildi (API: event=schedule toplam 0 calisma),
    # konfigurasyon kusursuz oldugu halde. Gunde 2 deneme yerine 24 deneme
    # yapip pencere disindakileri aninda sonlandirmak bu guvenilmezligi
    # telafi eder.
    #
    # Paylasim penceresi post_reel.py icindeki POST_WINDOWS ile belirlenir
    # (varsayilan 9-14 ve 17-22 TR, bitis saati dahil). Her pencerede 6
    # tetiklenme sansi var; biri tutunca o pencere kapanir. Pencere disi
    # calismalar Drive/IG'ye hic dokunmadan ~5 saniyede biter.
    - cron: "17 * * * *"

  # HARICI TETIKLEYICI - GitHub cron'unun yedegi.
  #
  # 9 Eylul 2026: schedule arka arkaya 3 kez dusdu (05:17, 06:17, 07:17 UTC),
  # ikisi paylasim penceresinin tam ortasindaydi. Saat basi deneme bile
  # yetmedi. Cozum: ayni isi disaridan da tetiklemek (cron-job.org).
  #
  # Cift paylasim riski yok, uc katman engelliyor:
  #   1. concurrency grubu -> iki calisma cakisirsa ikincisi bekler
  #   2. MIN_INTERVAL_HOURS -> son paylasimdan 2 saat gecmeden yenisi olmaz
  #   3. Drive'daki state.json -> yayinlanan video "published" isaretlenir
  #
  # Pencere kurali burada da gecerli (post_reel.py ENFORCE_WINDOW), yani
  # harici tetikleyici 7/24 vursa bile pencere disinda hicbir sey yapmaz.
  #
  # GUVENLIK: repository_dispatch icin PAT'e "Contents: write" gerekir; bu
  # yetki repoya kod push edebilir, yani ucuncu taraftaki (cron-job.org)
  # token sizarsa tum secret'lar sizar. Harici tetikleyici icin onerilen yol
  # asagidaki workflow_dispatch + sadece "Actions: write" yetkili PAT
  # (bkz README > Harici tetikleyici). Bu tetikleyici geriye uyumluluk icin
  # duruyor.
  repository_dispatch:
    types: [post-reel]

  workflow_dispatch:        # elle tetikleme + harici tetikleyici
    inputs:
      dry_run:
        description: "Instagram'a hicbir sey gonderme, sadece dogrula"
        type: boolean
        default: false
      # Varsayilan ACIK: harici tetikleyici API'yi girdisiz cagirir ve gece
      # 03:00'te paylasmamali. Elle hemen paylasmak icin kutuyu kaldirin.
      enforce_window:
        description: "Paylasim penceresine uy (hemen paylasmak icin kaldirin)"
        type: boolean
        default: true

concurrency:
  group: rotakesit-reels
  cancel-in-progress: false   # iki calisma cakisirsa ikincisi bekler, iptal olmaz

permissions:
  contents: read              # script GITHUB_TOKEN kullanmiyor, en dar yetki

jobs:
  post:
    runs-on: ubuntu-latest
    # post_reel.py kendi butcesini 35 dk tutar (RUN_BUDGET_SECONDS) ve bu
    # sure azalinca yeni deneme baslatmaz; kalan pay kurulum icin.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Bagimliliklar
        run: pip install --quiet -r requirements.txt

      - name: Reel yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          # Opsiyonel ayarlar - repo Variables'tan (secret degil) gelir.
          # Tanimsiz variable bos gelir, script o zaman varsayilani kullanir.
          USER_TAGS: ${{ vars.USER_TAGS }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MIN_INTERVAL_HOURS: ${{ vars.MIN_INTERVAL_HOURS }}
          POST_WINDOWS: ${{ vars.POST_WINDOWS }}
          MAX_RETRIES: ${{ vars.MAX_RETRIES }}
          MAX_TRANSIENT_RETRIES: ${{ vars.MAX_TRANSIENT_RETRIES }}
          DEFAULT_CAPTION: ${{ vars.DEFAULT_CAPTION }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # workflow_dispatch: girdiye gore '1'/'0'. Diger olaylarda bos ->
          # post_reel.py olay turune bakar (schedule/repository_dispatch = acik)
          ENFORCE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && (inputs.enforce_window && '1' || '0') || '' }}
        run: python post_reel.py

      - name: Hata bildirimi
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK tanimli degil, bildirim atlandi"
            exit 0
          fi
          MSG="rotakesit reels BASARISIZ - $RUN_URL"
          # content = Discord, text = Slack. Ikisini de gonderiyoruz ki
          # webhook'un hangisi oldugunu bilmek gerekmesin.
          jq -n --arg m "$MSG" '{content: $m, text: $m}' \
            | curl -sS -X POST -H "Content-Type: application/json" \
                   -d @- "$NOTIFY_WEBHOOK" > /dev/null
          echo "Bildirim gonderildi"
