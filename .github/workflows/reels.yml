name: rotakesit reels

on:
  schedule:
    # GitHub Actions cron UTC calisir. Turkiye = UTC+3 (yil boyu sabit).
    #
    # Dakika :00 DEGIL :17 - saat basi platformun en yogun ani ve GitHub
    # o yukte zamanlanmis calismalari geciktiriyor, bazen tamamen atliyor.
    # 4 Eylul 2026'da "0 15" ile calisma hic tetiklenmedi, bu yuzden kaydirildi.
    # Dakikasi kritikse harici tetikleyici sart (bkz README > Bilinen sinirlar).
    - cron: "17 6 * * *"    # 09:17 TR
    - cron: "17 15 * * *"   # 18:17 TR
  workflow_dispatch:        # elle tetikleme
    inputs:
      dry_run:
        description: "Instagram'a hicbir sey gonderme, sadece dogrula"
        type: boolean
        default: false

concurrency:
  group: rotakesit-reels
  cancel-in-progress: false   # iki calisma cakisirsa ikincisi bekler, iptal olmaz

permissions:
  contents: read              # script GITHUB_TOKEN kullanmiyor, en dar yetki

jobs:
  post:
    runs-on: ubuntu-latest
    # Bütce: indirme + upload 600s + poll 480s + kurulum. 30 dk yetmiyordu.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Bagimliliklar
        run: pip install --quiet -r requirements.txt

      - name: Reel yayinla
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          # Opsiyonel ayarlar - repo Variables'tan (secret degil) gelir
          USER_TAGS: ${{ vars.USER_TAGS }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MIN_INTERVAL_HOURS: ${{ vars.MIN_INTERVAL_HOURS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python post_reel.py

      - name: Hata bildirimi
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NOTIFY_WEBHOOK" ]; then
            echo "NOTIFY_WEBHOOK tanimli degil, bildirim atlandi"
            exit 0
          fi
          MSG="rotakesit reels BASARISIZ - $RUN_URL"
          # content = Discord, text = Slack. Ikisini de gonderiyoruz ki
          # webhook'un hangisi oldugunu bilmek gerekmesin.
          jq -n --arg m "$MSG" '{content: $m, text: $m}' \
            | curl -sS -X POST -H "Content-Type: application/json" \
                   -d @- "$NOTIFY_WEBHOOK" > /dev/null
          echo "Bildirim gonderildi"
